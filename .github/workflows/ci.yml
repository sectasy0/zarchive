name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  verify:
    name: Tests and Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check Out Sources
        uses: actions/checkout@v4

      - name: Set Up Native Dependencies
        uses: ./.github/actions/setup-native

      - name: Install Pinned Rust Toolchain
        shell: bash
        run: rustup show
      - name: Install Test Target
        shell: bash
        run: rustup target add "$BUILD_TARGET"
        env:
          BUILD_TARGET: ${{ matrix.target }}

      - name: Cache Cargo Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}
          cache-targets: true
          cache-on-failure: true

      - name: Run Tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix Binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          tar -czf "dist/zarchive-${PLATFORM}.tar.gz" -C "target/${BUILD_TARGET}/release" zarchive

      - name: Package Windows Binary and Runtime Libraries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist, package | Out-Null
          Copy-Item "target/$env:BUILD_TARGET/release/zarchive.exe" package/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" package/
          Compress-Archive -Path package/* -DestinationPath dist/zarchive-windows-x64.zip

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: zarchive-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14