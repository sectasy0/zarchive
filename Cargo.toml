[package]
name = "zarchive"
version = "0.1.0"
edition = "2024"
description = "Desktop archive manager built with GPUI"
authors = ["sectasy0 <sectasy0@gmail.com>"]
license = "WTFPL"

[package.metadata.bundle]
name = "ZArchive"
identifier = "io.github.sectasy0.zarchive"
icon = [
	"assets/app_icons/icon_full_128.png",
	"assets/app_icons/icon_full_256.png",
	"assets/app_icons/icon_full_512.png",
	"assets/app_icons/icon_full_512@2x.png",
]
category = "public.app-category.utilities"

[dependencies]
anyhow = "1"
brotli = "9.1"
bzip2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
csv = "1"
sha2 = "0.10"
sha1 = "0.10"
serde_json = "1"
shell-words = "1"
dirs = "6"
flate2 = "1"
fs_extra = "1.3"
gpui = { package = "gpui-kit", version = "0.8.1", features = ["test-support", "syntect"] }
image = { version = "0.25", default-features = false }
libarchive2 = "0.2.1"
libc = "0.2"
md-5 = "0.10"
lz4_flex = "0.14"
lzma-rust2 = "0.24"
open = "5"
 rfd = "0.15"
sevenz-rust = { version = "0.6.1", features = ["aes256"] }
tar = "0.4"
tempfile = "3"
trash = "5"
unrar = "0.5.8"
zeroize = "1"
xara = { version = "0.4.2", default-features = false }
zstd = "0.14"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "aes-crypto"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "0.8.1", features = ["test-support"] }

[profile.dev.package.image]
opt-level = 3
